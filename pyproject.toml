# 依赖源：默认走清华镜像（个人开发环境网络限制，2026-09 实测 Docker Hub 可达、PyPI 直连超时）
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project]
name = "atlas"
version = "0.1.2"
description = "Atlas - 可信 AI 问数平台（Apache Ossie 语义层 + 受控 NL2SQL + 可解释 Data Agent）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # 语义层：Apache Ossie 规范校验
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    # SQL 解析与校验（MVP 阶段，见 ADR-0005：Calcite 列入 Phase 2 评估）
    "sqlglot>=25.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # 存储与查询引擎
    "pyiceberg>=0.7",          # Apache Iceberg Python 客户端
    # data/loader.py 与 data/snapshot.py 直接依赖（建仓/快照的 Arrow 写路径）；
    # pyiceberg>=0.12 核心依赖已不含 pyarrow，直接依赖必须显式声明
    # （2026-09-03 CI 干净环境暴露：本地 .venv 为早期历史残留，掩盖漏声明）
    "pyarrow>=14.0",
    "mysql-connector-python>=9.0",  # Apache Doris（MySQL 协议）
    "psycopg[binary]>=3.2",    # PostgreSQL（Polaris / Atlas 元数据）
    # 向量检索
    # 客户端与服务端版本匹配：compose 用 milvusdb/milvus:v2.4.13，
    # pymilvus 3.x 与其协议不兼容（实测连接失败，2026-09-02），故锁 <3
    "pymilvus>=2.4,<3",
    "networkx>=3.3",           # MVP 图存储（Neo4j 为可选扩展）
    # Agent
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # HTTP 服务面（ADR-0012）：FastAPI + uvicorn（MIT/BSD 许可；pydantic 已有，
    # OpenAPI/校验原生，serving/api.py）
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # 可观测
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "prometheus-client>=0.20",
    # 安全：外部 IdP（RS256/JWKS）验签钩子（serving/auth.py；本地 HS256 自签发仅开发用）
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx>=0.27",  # fastapi TestClient 依赖（tests/test_api.py）
]
ml = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "bitsandbytes>=0.43",  # QLoRA 4bit 量化（ADR-0008）；MIT 许可
    "vllm>=0.6",
]
# Apache Calcite 不作为 MVP 依赖（ADR-0005）
# 如需 Phase 2 引入，需要 JVM + 独立服务，不在此处声明

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["agent", "semantic", "eval", "retrieval"]

# 第三方库无类型 stub（或不在主依赖，如 rdflib 仅供 eval/gold 可选脚本）：
# 边界值按 Any 处理，校验价值集中在 agent/semantic/eval 自身逻辑上。
[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "rdflib", "rdflib.*", "pymilvus", "pymilvus.*", "networkx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 需要完整数据集的测试",
    "security: 只读网关安全测试（必须通过）",
    "ossie: Apache Ossie 规范校验测试",
    "iceberg: Iceberg time travel / 快照相关测试",
]

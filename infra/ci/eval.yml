name: eval

# 语义层、提示词、模型相关变更自动触发回归评测
on:
  push:
    paths:
      - "semantic/**"
      - "agent/prompts/**"
      - "agent/**"
      - "eval/**"
      - "lora/**"
  pull_request:
    paths:
      - "semantic/**"
      - "agent/prompts/**"
      - "agent/**"
      - "eval/**"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Start infra
        run: docker compose up -d
      - name: Seed data (fixed snapshot)
        run: make seed
      - name: Run eval
        run: make eval
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/
      - name: Generate summary
        run: |
          python -m eval.report >> $GITHUB_STEP_SUMMARY

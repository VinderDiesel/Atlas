name: auto-tag

# pyproject.toml version → git tag（v<version>）自动版本锚点（2026-09-03）。
#
# 动机：仓库 v0.1 发布当时无 git tag（docs/release-notes-v0.1.md 在档、git tag 为
# 空），版本演进没有 git 锚点可追溯；此后改由 pyproject.toml [project].version
# 作为版本唯一事实源，lint 通过后自动打 tag，不再依赖手工记忆。
#
# 触发链（2026-09-03 改版）：
# - push main → semantic-lint（lint.yml）先跑；完成后本 workflow 才被触发，
#   conclusion==success 才执行——版本 tag 只锚定通过 CI 的 commit，坏代码不打 tag。
#   实现：on.workflow_run（workflow 间事件链；文档确认该事件下 GITHUB_TOKEN 可
#   正常持有 write 权限）。lint 失败/PR 触发/fork 触发的 run → job 条件不满足 → skipped。
# - workflow_dispatch 手动兜底：绕过 lint 直接检查/打 tag（lint 不可用时的显式入口）。
# - 注意：workflow_run 的 GITHUB_SHA = 默认分支最新 commit，不是触发 run 的 commit
#   → checkout 必须显式用 event.workflow_run.head_sha（见下）；lint.yml 若改名，
#   本链静默失效（workflows 按 name 匹配不报错）——改 lint.yml name 须同步此处。
#
# 行为：
# - 远端已存在 v<version> → 跳过（幂等：版本未 bump 不重复打 tag）。
# - 不存在 → 以 annotated tag 打在通过 lint 的 commit 并 push（GITHUB_TOKEN）。
# - 只打 git tag，不建 GitHub Release（范围外，需要 Release Notes 时再扩）。
#
# 已知边界（诚实声明）：
# - 版本 bump 与 lint 通过不在同一 commit：tag 锚定的是“通过 lint 的 HEAD”，
#   若 lint 在版本 bump 后的 commit 上失败，该版本不会被打 tag（符合本改版意图）。
# - v0.1.0 无历史 tag：lint-gated 机制上线前由 push 直接触发补打（run 33729727159），
#   发布文档时代未打 tag 是既成事实，历史 commit 不回补（tag 不撒谎：锚定谁就是谁）。
# - 并发竞态（同 version 两个 push 抢同一个 tag）：先到者成功，后到者 push
#   失败报错可见、重跑即跳过，不静默吞掉。
# - 权限面：permissions.contents=write 是打 tag 所需的最小权限（GITHUB_TOKEN
#   推送无需个人 token，匿名 bot 署名）。

on:
  workflow_run:
    workflows: [semantic-lint]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    # 只处理本体仓库 main 分支 lint 成功的 run；PR/fork/失败的 run 一律跳过
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 事件下 GITHUB_SHA=默认分支最新，必须显式检出触发 run 的
          # commit 才能把 tag 打在“通过 lint 的那个 commit”上；dispatch 时取触发 sha
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # 打 tag 只需目标 commit 本身；远端 tag 用 ls-remote 直查，无需本地 tag 历史
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # tomllib 需 >=3.11：显式锁定，不赌 runner 自带 python 版本

      - name: Resolve version from pyproject.toml
        id: version
        # step output 必须写 $GITHUB_OUTPUT 文件（stdout 裸打印不解析——首次实测
        # 踩坑：print 输出 TAG 为空，git tag '' 失败，2026-09-03 run 33729391255）
        run: |
          python3 - <<'EOF'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          # git ref 规则：tag 名只允许 [0-9A-Za-z.-]；非法 version 直接失败可见
          if not re.fullmatch(r"[0-9A-Za-z.\-]+", version):
              raise SystemExit(f"pyproject version 含 git ref 非法字符：{version!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag=v{version}\n")
          EOF

      - name: Check tag on remote
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        # annotated tag（-m）需要提交者身份：local config 限定本仓库，匿名 bot 署名
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Atlas $TAG（自动版本锚点：pyproject.toml version）"
          git push origin "$TAG"

name: auto-tag

# pyproject.toml version → git tag（v<version>）自动版本锚点（2026-09-03）。
#
# 动机：仓库 v0.1 发布当时无 git tag（docs/release-notes-v0.1.md 在档、git tag 为
# 空），版本演进没有 git 锚点可追溯；此后改由 pyproject.toml [project].version
# 作为版本唯一事实源，push 自动打 tag，不再依赖手工记忆。
#
# 行为：
# - 触发：push main/master 每次自动检查 + workflow_dispatch 手动补跑。
# - 远端已存在 v<version> → 跳过（幂等：版本未 bump 不重复打 tag）。
# - 不存在 → 以 annotated tag 打在本次触发 commit 并 push（GITHUB_TOKEN）。
# - 只打 git tag，不建 GitHub Release（范围外，需要 Release Notes 时再扩）。
#
# 已知边界（诚实声明）：
# - tag 锚定的是触发 push 的 HEAD，不是版本号变更 commit 本身；版本 bump 与
#   push 通常同 commit，单人仓库可接受。
# - v0.1.0 无历史 tag：首次触发会把 v0.1.0 补打在当时的 HEAD——发布文档时代
#   未打 tag 是既成事实，历史 commit 不回补（tag 不撒谎：锚定谁就是谁）。
# - 并发竞态（同 version 两个 push 抢同一个 tag）：先到者成功，后到者 push
#   失败报错可见、重跑即跳过，不静默吞掉。
# - 权限面：permissions.contents=write 是打 tag 所需的最小权限（GITHUB_TOKEN
#   推送无需个人 token，匿名 bot 署名）。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 打 tag 只需触发 commit 本身；远端 tag 用 ls-remote 直查，无需本地 tag 历史
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # tomllib 需 >=3.11：显式锁定，不赌 runner 自带 python 版本

      - name: Resolve version from pyproject.toml
        id: version
        run: |
          python3 - <<'EOF'
          import re
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          # git ref 规则：tag 名只允许 [0-9A-Za-z.-]；非法 version 直接失败可见
          if not re.fullmatch(r"[0-9A-Za-z.\-]+", version):
              raise SystemExit(f"pyproject version 含 git ref 非法字符：{version!r}")
          print(f"tag=v{version}")
          EOF

      - name: Check tag on remote
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        # annotated tag（-m）需要提交者身份：local config 限定本仓库，匿名 bot 署名
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Atlas $TAG（自动版本锚点：pyproject.toml version）"
          git push origin "$TAG"

name: eval-regression

# Day 40：提示词/语义层/评测代码变更 → 自动回归评测（无数据版）。
#
# 设计约束（诚实边界）：
# - 公共 runner 无 TPC-DI 数据源与 Doris 数据环境 → EX（执行一致率）无法在 CI 跑；
#   CI 回归 = 语义 lint + 契约测试 + Plan Acc 回归（eval.runner --dry，无数据库）。
# - Plan Acc 回归门槛 = dry 报告自洽（plan_acc+clarify 覆盖 finance_total 且
#   exec_errors=0）；跨提交数值变化由 step summary 人工评审（不硬编码基线防腐化）。
# - 完整数据评测（EX）保留为手动触发 job：eval-data，需自托管/数据环境后使用
#   （先 make up && make seed && make dwd）。

on:
  push:
    branches: [main, master]
    paths:
      - "semantic/**"
      - "agent/prompts/**"
      - "agent/**"
      - "eval/**"
      - "lora/**"
      - "Makefile"
      - ".github/workflows/eval.yml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "semantic/**"
      - "agent/prompts/**"
      - "agent/**"
      - "eval/**"
      - "lora/**"
      - "Makefile"
  workflow_dispatch:

jobs:
  plan-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install deps (uv sync, mirrors local .venv)
        # 与 lint.yml 同口径（2026-09-03：手工最小清单漏 langgraph/opentelemetry/…
        # 顶层 import，只在干净 checkout 暴露）→ 全量同步。默认 PyPI（runner 在美国）。
        run: uv sync --extra dev --frozen
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple

      - name: Semantic layer lint (structure / governance / gold schema)
        # CI 无 FIBO 闭包：governance_validate 走权威注册表轻量校验，闭包级深度
        # 校验由本地 data/fibo/validate_alignments.py 执行（与 lint.yml 同口径）
        run: make PYTHON=.venv/bin/python lint

      - name: Contract tests
        run: make PYTHON=.venv/bin/python test

      - name: Plan Acc regression (eval.runner --dry, no DB)
        # dry 模式 = Planner/Compiler 确定性回归（语义层与提示词变更的主信号）；
        # 产出 JSON 到文件，后续步骤机械转述（不手写数字）
        run: |
          .venv/bin/python -m eval.runner --dry > /tmp/dry-report.json
          .venv/bin/python - <<'PY'
          import json
          report = json.load(open("/tmp/dry-report.json", encoding="utf-8"))
          s = report["summary"]
          assert s["exec_errors"] == 0, f"dry 回归出现执行错误: {s}"
          plan_ok = int(s["plan_acc"].split("/")[0])
          total = int(s["plan_acc"].split("/")[1])
          clarify_ok = int(s["clarify"].split("/")[0])
          amb = int(s["clarify"].split("/")[1])
          # 自洽门槛：非歧义全命中 + 歧义全反问 + 无错误，即确定性链无回归
          assert total > 0
          assert plan_ok == total, f"Plan Acc 回归: {s['plan_acc']}"
          assert clarify_ok == amb, f"歧义反问回归: {s['clarify']}"
          assert s["finance_total"] == total + amb
          print("dry 回归门槛通过：", json.dumps(s, ensure_ascii=False))
          PY

      - name: Publish summary
        # 机械转述 dry 摘要到 PR/commit 摘要（数字来自 eval.runner 输出）
        run: |
          .venv/bin/python - <<'PY'
          import json
          report = json.load(open("/tmp/dry-report.json", encoding="utf-8"))
          s = report["summary"]
          lines = [
              "## Plan Acc 回归（eval.runner --dry，绑定 sha `" + report["sha"] + "`）",
              "",
              "| 指标 | 值 |",
              "|---|---|",
          ]
          for k, v in s.items():
              lines.append(f"| {k} | {v} |")
          lines.append("")
          lines.append("口径：dry 模式不执行 SQL（EX 需数据环境，见 eval-data job）。")
          with open("summary.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          PY
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"

  # 完整数据评测（EX）：手动触发。前置：数据环境就绪（docker compose 全栈 +
  # TPC-DI 数据源 + make seed && make dwd + 快照锁定）。公共 runner 无数据，
  # 用于自托管 runner 或数据缓存就绪后。
  eval-data:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Start infra (requires data environment)
        run: docker compose up -d
      - name: Full eval
        run: make eval && make baseline && make compare && make report
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval/reports/
      - name: Publish EVAL_REPORT
        run: |
          cat EVAL_REPORT.md >> "$GITHUB_STEP_SUMMARY"

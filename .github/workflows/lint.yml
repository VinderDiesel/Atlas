name: semantic-lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install deps (uv sync, mirrors local .venv)
        # 历史：手工最小依赖清单两次漏声明（2026-09-03 CI 暴露 langgraph /
        # opentelemetry / pyarrow（pyiceberg 传递）顶层 import 缺失，且两次都只
        # 在干净 checkout 上暴露）→ 改与本地同口径的全量同步；测试若引入新的
        # 第三方顶层 import，只需进 pyproject.toml（uv.lock 同 commit 更新）。
        # runner 在美国：默认 PyPI 覆盖 pyproject 内清华镜像 default。
        run: uv sync --extra dev --frozen
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple

      - name: Semantic layer lint (structure / governance / gold schema)
        # CI 无 FIBO 闭包：governance_validate 走权威注册表（data/fibo/iri_registry.json）轻量校验，
        # 闭包级深度校验（rdflib）由本地 data/fibo/validate_alignments.py 与 eval/gold/validate_gold.py 执行
        run: make PYTHON=.venv/bin/python lint

      - name: Contract tests (compiler / planner / guard / retrieval)
        # unittest 零测试框架依赖，pytest 兼容；覆盖 gold-101~103 编译链路、
        # 只读 Guard、BM25/图约束/元数据 Rerank 契约（graph_store 需 networkx）
        run: make PYTHON=.venv/bin/python test

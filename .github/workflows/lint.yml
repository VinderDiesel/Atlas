name: semantic-lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        # 语义层 lint 与契约测试的第三方顶层依赖：编译器/规划器 sqlglot+pyyaml、
        # 治理/结构校验 jsonschema、图约束召回 networkx（pymilvus 在 milvus_client
        # 内延迟导入，unittest 不触发，故不入列）；Day 39 起 eval.runner 顶层
        # import mysql.connector（dry 模式同样触发）、agent.generator 顶层
        # import dotenv（test_build_pairs/test_generator 触发），故补
        # mysql-connector-python 与 python-dotenv。新增测试若引入新的第三方顶层
        # import，必须同步此清单——本地 .venv 是全量安装，漏声明只在 CI 暴露。
        run: pip install pyyaml jsonschema sqlglot networkx mysql-connector-python python-dotenv

      - name: Semantic layer lint (structure / governance / gold schema)
        # CI 无 FIBO 闭包：governance_validate 走权威注册表（data/fibo/iri_registry.json）轻量校验，
        # 闭包级深度校验（rdflib）由本地 data/fibo/validate_alignments.py 与 eval/gold/validate_gold.py 执行
        run: make PYTHON=python lint

      - name: Contract tests (compiler / planner / guard / retrieval)
        # unittest 零测试框架依赖，pytest 兼容；覆盖 gold-101~103 编译链路、
        # 只读 Guard、BM25/图约束/元数据 Rerank 契约（graph_store 需 networkx）
        run: make PYTHON=python test

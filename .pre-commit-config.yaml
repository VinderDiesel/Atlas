repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 禁止手改生成的 DAG
  - repo: local
    hooks:
      - id: protect-generated-dags
        name: 禁止手工编辑 airflow/dags/generated/
        entry: echo "ERROR: airflow/dags/generated/ 由 YAML 生成，禁止手工编辑（见 AGENTS.md N5）"
        language: fail
        files: ^airflow/dags/generated/

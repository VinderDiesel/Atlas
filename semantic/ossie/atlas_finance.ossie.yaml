# yaml-language-server: $schema=https://raw.githubusercontent.com/apache/ossie/main/core-spec/ossie-schema.json
#
# Atlas 金融语义模型 —— Apache Ossie Core Metadata Spec 0.2.0.dev0
#
# 数据来源：TPC-DI v1.1.0 零售证券经纪基准（公开注册下载），不对应任何真实企业指标。
# 表结构遵循 TPC-DI 规范 DW schema（dim_account / dim_trade / fact_cash_balances 等），
# 代理键列名保留 SK_ 前缀，字段名与规范一致，可审计。
#
# 治理扩展（owner/version/supersedes/lineage/row_policy）不在 Ossie 核心规范中，
# 通过 custom_extensions: vendor_name = ATLAS 承载，见 ../governance/
# FIBO 概念对齐（fibo_alignment，ADR-0007 L2 层）同样挂载于此，
# 所有概念 IRI 已经 data/fibo/check_iris.py 实测验证存在。
#
# ⚠️ 0.2.0.dev0 为 DRAFT，schema 可能变化。锁定时需在 README 记录具体 commit sha。
# 2026-09-02 修改：指标 6 → 15（P0 门槛），新增成交量/交易税/证券数/客户数/持仓量/
#   持仓账户数/现金账户数/平均成交价，全部基于既有事实表可聚合列，同义词已做冲突预检。
# 2026-09-02 修改：15 指标治理补齐（11 个新指标补 ATLAS custom_extensions），
#   quality.gold_test_cases 与 eval/gold 引用集双向对齐（governance_validate 强制），
#   修正 cash_balance 错位引用（gold-102 实为 commission_revenue 用例）。

# 2026-09-03 修改：指标 15 → 20（第二批 P0 扩展），FIBO 覆盖审计补齐 9 条映射
#   （22 → 31；概念清单 26 → 29，见 data/fibo/README.md 审计节）。
#   total_trade_tax 因锁定闭包无贴切税务金额类，登记为待办（不硬补）。
# 2026-09-03 修改（ADR-0014 ① filter MVP）：dim_date 三日历字段 is_time false → true
#   （修复时间词"年/月/季度"混入 dimension_synonyms 导致"2013 年"误命中维度的缺陷）；
#   total_trade_value/commission_revenue/total_trade_quantity 三指标 quality.gold_test_cases
#   补入 filter 能力样本 gold-149 ~ 154（governance_validate 双向对齐）。
# 2026-09-04 修改（compiler 时间声明化）：custom_extensions data JSON 加 time_dimension
#   键（第 7 键，single 模式）——compiler 时间列不再硬编码，由模型声明驱动；
#   值 = 原 TIME_COLUMNS 常量逐字（CalendarYearID/CalendarQtrID/CalendarMonthID/DateValue）。
# 2026-09-05 修改（P6 英文样本）：total_trade_value/commission_revenue/cash_balance/
#   trade_count 四指标 quality.gold_test_cases 补入英文样本 gold-163~170
#   （lang_en，语言 = 样本 tags 属性，不新增目录维度）。

version: "0.2.0.dev0"

semantic_model:
  - name: atlas_finance_analytics
    description: >
      Atlas 金融分析语义模型，基于 TPC-DI 零售证券经纪基准重建。
      覆盖交易、持仓、现金余额、账户、客户、证券、经纪机构七个域，
      用于验证语义层 → 指标平台 → NL2SQL 的端到端链路，并承载 FIBO 概念对齐。
    ai_context:
      instructions: >
        使用本模型进行证券经纪业务分析。
        涉及"交易额/成交金额"优先使用 total_trade_value（数量 × 成交价）；
        涉及"佣金"使用 commission_revenue；
        涉及"持仓"使用 holdings_value（按最新快照日）；
        涉及"现金"使用 cash_balance；
        所有金额默认单位为美元，时间默认时区 +08:00。
        当用户问句存在歧义（未指明时间范围、未指明拆分维度）时，必须反问澄清，不要猜测。
      synonyms:
        - "金融分析"
        - "证券分析"
        - "经纪业务"
        - "交易分析"
        - "财富管理"

    # ===================================================================
    # 治理扩展：Ossie 核心规范不覆盖的部分（本项目价值所在）
    # ===================================================================
    custom_extensions:
      - vendor_name: ATLAS
        data: |
          {
            "governance": {
              "owner": "finance@atlas.local",
              "version": 1,
              "status": "active",
              "review_cycle_days": 30,
              "supersedes": null,
              "reason": null,
              "migration_window": null
            },
            "lineage": {
              "source_system": "TPC-DI v1.1.0 SF1",
              "source_catalog": "atlas",
              "source_tables": ["dim_account", "dim_broker", "dim_customer", "dim_security", "dim_date", "dim_trade", "fact_cash_balances", "fact_holdings"],
              "transform_jobs": ["sql/dwd/*", "sql/dws/*"],
              "downstream_consumers": []
            },
            "freshness": {
              "schedule": "30 1 * * *",
              "sla_minutes": 90,
              "expected_lag_hours": "<待实测填写>"
            },
            "policy": {
              "default_row_policy": "rp_branch_visible",
              "require_approval_for_change": true,
              "approvers": ["finance-metric-owners"]
            },
            "quality": {
              "gold_test_cases": ["gold-101", "gold-102", "gold-103"],
              "last_validated_at": null
            },
            "fibo_alignment": {
              "layer": "L2",
              "fibo_commit": "119fa8c091aa4beece7d22aefa6fe138021a4355",
              "commons_release": "20250801",
              "verification": "data/fibo/check_iris.py",
              "mappings": {
                "dim_customer": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/People/Person",
                  "match_type": "exact_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "TPC-DI 客户均为自然人（含 gender/DOB），FIBO Person = individual human being"
                },
                "dim_account": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/BrokerageAccount",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "TPC-DI 账户为证券经纪账户，FIBO BrokerageAccount = 由经纪公司提供的投资账户"
                },
                "dim_account->dim_customer": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/AccountHolder",
                  "match_type": "related",
                  "confidence": "medium",
                  "verified_at": "2026-09-02",
                  "note": "账户与客户的归属关系对应 AccountHolder 语义"
                },
                "dim_security": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security",
                  "match_type": "exact_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "TPC-DI 证券（股票/基金）即 FIBO Security 的子类集合"
                },
                "dim_broker": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BrokerageFirm",
                  "match_type": "broad_match",
                  "confidence": "medium",
                  "verified_at": "2026-09-02",
                  "note": "TPC-DI broker 为经纪公司雇员，映射至其所属机构 BrokerageFirm；个体角色映射待扩展"
                },
                "dim_broker.Branch": {
                  "concept": "https://www.omg.org/spec/Commons/Organizations/OrganizationalSubUnit",
                  "match_type": "broad_match",
                  "confidence": "medium",
                  "verified_at": "2026-09-02",
                  "note": "营业部/分支是组织的子单元，FIBO 2.0 该概念位于 OMG Commons"
                },
                "dim_date": {
                  "concept": "https://www.omg.org/spec/Commons/DatesAndTimes/Date",
                  "match_type": "exact_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "FIBO 2.0 时间基础概念位于 OMG Commons DatesAndTimes"
                },
                "fact_trades": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/SecuritiesTransaction",
                  "match_type": "exact_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "TPC-DI 交易事实即证券交易；上层概念 MarketTransaction（FND/TransactionsExt）亦已验证存在"
                },
                "fact_trades.TradePrice": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "成交价是货币金额"
                },
                "fact_trades.Commission": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Fee",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "佣金是经纪服务收取的费用"
                },
                "fact_cash_balances.Cash": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Balance",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "现金余额是账户余额的一种"
                },
                "metric:total_trade_value": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "交易额的量纲是货币金额"
                },
                "metric:commission_revenue": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Fee",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "佣金收入对应经纪服务 Fee"
                },
                "metric:holdings_value": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount",
                  "match_type": "related",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "持仓市值按货币金额度量；持仓本体概念（MD 域）未纳入本次子集，待扩展"
                },
                "metric:cash_balance": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Balance",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "现金余额即账户 Balance"
                },
                "metric:trade_count": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/SecuritiesTransaction",
                  "match_type": "related",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "交易笔数是对证券交易事件的计数"
                },
                "metric:active_account_count": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/BrokerageAccount",
                  "match_type": "related",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "活跃账户数是对经纪账户的计数"
                },
                "metric:average_trade_value": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "每笔成交金额的量纲是货币金额（Day 27 审核发布）"
                },
                "metric:average_commission_per_trade": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Fee",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "每笔佣金属于经纪服务 Fee（Day 27 审核发布）"
                },
                "metric:commission_rate": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Fee",
                  "match_type": "related",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "佣金率是 Fee 相对成交金额的占比，量纲为比率（Day 27 审核发布）"
                },
                "metric:average_holding_value": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount",
                  "match_type": "related",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "户均持仓市值按货币金额度量（Day 27 审核发布）"
                },
                "metric:average_cash_balance": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Balance",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-02",
                  "note": "户均现金余额即账户 Balance（Day 27 审核发布）"
                },
                "fact_holdings": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Holding",
                  "match_type": "broad_match",
                  "confidence": "medium",
                  "verified_at": "2026-09-03",
                  "note": "持仓快照行=账户对证券的权益（Holding=owned financial interest）；MD 域细粒度持仓本体仍未纳入子集"
                },
                "metric:total_trade_quantity": {
                  "concept": "https://www.omg.org/spec/Commons/QuantitiesAndUnits/ScalarQuantity",
                  "match_type": "related",
                  "confidence": "medium",
                  "verified_at": "2026-09-03",
                  "note": "成交量=带单位（股）的标量数量；闭包扩展 QUDT QuantityValue 后可升级"
                },
                "metric:holdings_quantity": {
                  "concept": "https://www.omg.org/spec/Commons/QuantitiesAndUnits/ScalarQuantity",
                  "match_type": "related",
                  "confidence": "medium",
                  "verified_at": "2026-09-03",
                  "note": "持仓量=带单位（股）的标量数量（口径同上）"
                },
                "metric:traded_security_count": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security",
                  "match_type": "related",
                  "confidence": "high",
                  "verified_at": "2026-09-03",
                  "note": "成交证券数=对证券的去重计数"
                },
                "metric:holding_security_count": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security",
                  "match_type": "related",
                  "confidence": "high",
                  "verified_at": "2026-09-03",
                  "note": "持仓证券数=对证券的去重计数"
                },
                "metric:active_customer_count": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/People/Person",
                  "match_type": "related",
                  "confidence": "high",
                  "verified_at": "2026-09-03",
                  "note": "活跃客户数=对客户（自然人）的去重计数"
                },
                "metric:holding_account_count": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/BrokerageAccount",
                  "match_type": "related",
                  "confidence": "high",
                  "verified_at": "2026-09-03",
                  "note": "持仓账户数=持有证券的经纪账户去重计数"
                },
                "metric:cash_account_count": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/BrokerageAccount",
                  "match_type": "related",
                  "confidence": "high",
                  "verified_at": "2026-09-03",
                  "note": "现金账户=有现金余额的经纪账户（锁定闭包无 CashAccount 类）"
                },
                "metric:avg_trade_price": {
                  "concept": "https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/UnitPrice",
                  "match_type": "broad_match",
                  "confidence": "high",
                  "verified_at": "2026-09-03",
                  "note": "平均成交价=每股成交单价（UnitPrice=相对计量单位的货币价格）"
                }
              }
            },
            "time_dimension": {
              "table": "dim_date",
              "mode": "single",
              "columns": {
                "year": "CalendarYearID",
                "quarter": "CalendarQtrID",
                "month": "CalendarMonthID",
                "date": "DateValue"
              }
            }
          }

    # ===================================================================
    # Datasets
    # 列名遵循 TPC-DI 规范（SK_ 代理键前缀），不做重命名，保证可审计
    # ===================================================================
    datasets:
      - name: fact_trades
        source: atlas.dwd.fact_trades
        primary_key:
          - TradeID
        unique_keys:
          - [TradeID]
        description: 证券交易事实（TPC-DI dim_trade 中的成交记录），每行一笔已执行交易
        ai_context:
          synonyms:
            - "交易明细"
            - "成交记录"
            - "交易流水"
        fields:
          - name: TradeID
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: TradeID
            description: 交易标识（自然键）
            datatype: Integer
            dimension:
              is_time: false

          - name: SK_CreateDateID
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: SK_CreateDateID
            description: 成交日期外键，指向 dim_date
            datatype: Integer
            dimension:
              is_time: false
            ai_context:
              synonyms:
                - "交易日期"
                - "成交日期"

          - name: SK_AccountID
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: SK_AccountID
            description: 账户外键，指向 dim_account
            datatype: Integer
            dimension:
              is_time: false
            ai_context:
              synonyms:
                - "账户"
                - "客户账户"

          - name: SK_CustomerID
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: SK_CustomerID
            description: 客户外键，指向 dim_customer
            datatype: Integer
            dimension:
              is_time: false
            ai_context:
              synonyms:
                - "客户"
                - "交易客户"

          - name: SK_BrokerID
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: SK_BrokerID
            description: 经纪人外键，指向 dim_broker
            datatype: Integer
            dimension:
              is_time: false
            ai_context:
              synonyms:
                - "经纪人"
                - "客户经理"

          - name: SK_SecurityID
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: SK_SecurityID
            description: 证券外键，指向 dim_security
            datatype: Integer
            dimension:
              is_time: false
            ai_context:
              synonyms:
                - "证券"
                - "标的"

          - name: Quantity
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Quantity
            description: 成交数量（股/份）
            datatype: Decimal
            ai_context:
              synonyms:
                - "数量"
                - "成交量"

          - name: TradePrice
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: TradePrice
            description: 成交单价（美元）
            datatype: Decimal
            ai_context:
              synonyms:
                - "成交价"
                - "成交单价"
                - "价格"

          - name: Commission
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Commission
            description: 佣金（美元），经纪服务费
            datatype: Decimal
            ai_context:
              synonyms:
                - "佣金"
                - "手续费"

          - name: Tax
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Tax
            description: 交易税（美元）
            datatype: Decimal
            ai_context:
              synonyms:
                - "税费"
                - "交易税"

          - name: CashFlag
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: CashFlag
            description: 现金交易标记（true=现金 / false=融资）
            datatype: Boolean
            dimension: {}
            ai_context:
              synonyms:
                - "现金交易"
                - "融资交易"

          - name: Status
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Status
            description: 交易状态（完成/取消等）
            datatype: String
            dimension: {}
            ai_context:
              synonyms:
                - "交易状态"

          - name: Type
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Type
            description: 交易类型（买入/卖出等）
            datatype: String
            dimension: {}
            ai_context:
              synonyms:
                - "交易类型"
                - "买卖方向"

      - name: fact_holdings
        source: atlas.dwd.fact_holdings
        primary_key:
          - HoldingID
        unique_keys:
          - [HoldingID]
        description: 持仓事实（账户在某日的持仓快照）
        ai_context:
          synonyms:
            - "持仓明细"
            - "持仓快照"
        fields:
          - name: HoldingID
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: HoldingID
            description: 持仓标识
            datatype: Integer
            dimension:
              is_time: false

          - name: SK_AccountID
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: SK_AccountID

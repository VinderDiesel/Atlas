    # ===================================================================
    # Metrics
    # 注意：expression 按方言存储（Ossie 是 expression-carrying）
    #       DATABRICKS 方言为占位，需实测后填写，不得编造
    # ===================================================================
    metrics:
      - name: total_trade_value
        description: 总交易额（成交金额），成交数量 × 成交单价合计
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(fact_trades.Quantity * fact_trades.TradePrice)
        datatype: Decimal
        ai_context:
          synonyms:
            - "交易额"
            - "成交额"
            - "成交金额"
            - "交易量金额"
        custom_extensions:
          - vendor_name: ATLAS
            data: |
              {
                "governance": {
                  "owner": "finance@atlas.local",
                  "version": 1,
                  "status": "active",
                  "supersedes": null
                },
                "lineage": {
                  "source_columns": ["fact_trades.Quantity", "fact_trades.TradePrice"],
                  "dependencies": []
                },
                "quality": {
                  "gold_test_cases": ["gold-101", "gold-116", "gold-123", "gold-124", "gold-141", "gold-146", "gold-152", "gold-163", "gold-164", "gold-165"],
                  "expected_value_snapshot_sha": "30b8344"
                }
              }


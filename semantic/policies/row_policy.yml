# 行级权限策略：必须能编译为可解释的 SQL 谓词
# 纵深防御：应用层过滤不算，谓词必须下推到 SQL
# 策略名通过语义模型 custom_extensions.policy.default_row_policy 引用
# 变更：2026-09-02 Day 25——谓词列名对齐真实 DDL（Doris 列小写：
#   branch / brokerid / tier），compliance_auditor 条件方向改为
#   tier <= max_tier（与描述“仅能看低敏感层”一致，原 >= min_tier 矛盾）
# 变更：2026-09-04 P5——rp_dept_visible 条件列对齐物理（TPC-DS 数据落地）：
#   未落地逻辑列 region/product_category 改为 dim_store.s_state /
#   dim_item.i_category（物理裸名与编译 SQL 表名一致；谓词表不在查询时由
#   Guard 沿语义 join 图自动补 LEFT JOIN）。条件表名 dim_store/dim_item 即
#   物理表（atlas.dwd.dim_store / dim_item），auth.sql_in 渲染列表值。

policies:
  - name: rp_dept_visible
    description: 零售模型（TPC-DS）：用户只能看到自己所属州/品类的数据（region → dim_store.s_state、product_category → dim_item.i_category，2026-09-04 P5 对齐物理）
    roles:
      - name: hq_admin
        condition: "1=1"
        columns: "*"
      - name: region_manager
        description: 大区（州）经理：仅见本州门店数据（SF0.1 实测单州 TN）
        condition: "dim_store.s_state = '{{ user.region }}'"
        columns: "*"
      - name: category_analyst
        description: 品类分析师：本州 + 指定品类（列表由 auth sql_in 渲染）
        condition: "dim_store.s_state = '{{ user.region }}' AND dim_item.i_category IN ({{ user.categories | sql_in }})"
        columns: "*"
    default_deny: true

  - name: rp_branch_visible
    description: 金融模型（TPC-DI）：用户只能看到自己分支/客户名下的数据（谓词经 dim_broker / dim_customer 下推，注入时按编译 SQL 别名对齐）
    roles:
      - name: hq_admin
        condition: "1=1"
        columns: "*"
      - name: branch_manager
        condition: "dim_broker.branch = '{{ user.branch }}'"
        columns: "*"
      - name: broker
        condition: "dim_broker.brokerid = {{ user.brokerid }}"
        columns: "*"
      - name: compliance_auditor
        condition: "dim_customer.tier <= {{ user.max_tier }}"
        columns: "*"
        description: 合规审查按客户分层降级可见（仅能看 tier 不超过上限的低敏感档）
    default_deny: true

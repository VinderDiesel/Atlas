# 行级权限策略：必须能编译为可解释的 SQL 谓词
# 纵深防御：应用层过滤不算，谓词必须下推到 SQL
# 策略名通过语义模型 custom_extensions.policy.default_row_policy 引用

policies:
  - name: rp_dept_visible
    description: 零售模型：用户只能看到自己所属大区的数据
    roles:
      - name: hq_admin
        condition: "1=1"
        columns: "*"
      - name: region_manager
        condition: "region = '{{ user.region }}'"
        columns: "*"
      - name: category_analyst
        condition: "region = '{{ user.region }}' AND product_category IN ({{ user.categories | sql_in }})"
        columns: "*"
    default_deny: true

  - name: rp_branch_visible
    description: 金融模型（TPC-DI）：用户只能看到自己分支/客户名下的数据（经 dim_broker.Branch / dim_broker.BrokerID 下推）
    roles:
      - name: hq_admin
        condition: "1=1"
        columns: "*"
      - name: branch_manager
        condition: "dim_broker.branch = '{{ user.branch }}'"
        columns: "*"
      - name: broker
        condition: "dim_broker.broker_id = {{ user.broker_id }}"
        columns: "*"
      - name: compliance_auditor
        condition: "dim_customer.tier >= {{ user.min_tier }}"
        columns: "*"
        description: 合规审查按客户分层降级可见（仅能看低敏感层）
    default_deny: true

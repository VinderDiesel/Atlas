# 中文形态触发词词典（locale=zh_cn）：解析器形态层的**数据**，不是口径定义
#
# owner: agent（解析器形态层；口径定义的唯一权威源仍是 semantic/ossie/）
# 最后修改: 2026-09-08 从 agent/planner.py 的字面量正则/词表外置（ADR-0015 §②，
#           批次 B3a）——**纯搬运**：模式串逐字复制，未做任何"顺手优化"。
#           等价性对照与验收口径见 docs/design/adr-0015-pattern-lexicon-zh.md。
#
# 分节即能力（节名与 planner 的解析阶段一一对应，缺节 = 加载失败）：
#   time / grouping / topn / filter_include / filter_exclude / threshold /
#   magnitude / followup
#
# 两条硬约定：
#   1. **顺序即语义**：time.patterns 是有序列表，解析按声明顺序逐个尝试
#      （原实现依赖 date → iso_date → quarter → iso_quarter → month → year 的
#      先后，短模式若先跑会截获长模式的输入，例如"2013 年 7 月"被当成年份）；
#   2. 模式串必须是完整正则（含 lookahead / 非贪婪锚定 / `$` 边界等语义关键部分），
#      不允许在代码里用词表重组——重组函数本身会成为中国正确性负担。
#
# 换场景怎么改：新场景要支持"只看/仅统计"之外的等值触发词（如"限定"），
# 只在本文件 filter_include.pattern 的交替里加词，并补对应黄金集样本复验。

# -- 时间形态（绝对时间解析 + 相对时间拒答）--------------------------------
time:
  # 相对时间词：命中即反问（固定快照评测下相对时间必然漂移，ADR-0014 ③ 设计性不支持）
  relative_reject:
    words:
      - 上个月
      - 上季度
      - 上月
      - 上旬
      - 去年
      - 今年
      - 最近
      - 本月
      - 本周
      - 昨天
      - 今天
      - 近
  patterns:
    # 1) 中文全写日期："2013 年 7 月 5 日"（月/日补零后作 ISO date）
    - kind: date
      pattern: '(\d{4}) 年 (\d{1,2}) 月 (\d{1,2}) 日'
    # 2) ISO 日期："2013-07-05"（中英共享，英文侧复用同一条，不复制第二份）
    - kind: iso_date
      pattern: '(\d{4})-(\d{2})-(\d{2})'
    # 3) 中文季度："2013 年第三季度"（阿拉伯数字季度编号走 iso_quarter）
    - kind: quarter
      pattern: '(\d{4}) 年?第?([一二三四])季度'
    # 4) ISO 季度："2013Q2" / "2013 Q2"（\s* 兼容空格，2026-09-08 修复随本批保留）
    - kind: iso_quarter
      pattern: '(\d{4})\s*[Qq]([1-4])'
    # 5) 年月："2013 年 7 月"（month = 年*100+月）
    - kind: month
      pattern: '(\d{4}) 年 (\d{1,2}) 月'
    # 6) 年份兜底："2013 年"
    - kind: year
      pattern: '(\d{4}) 年'

# -- 分组结构（显式结构词，通用词无结构时不触发分组）------------------------
grouping:
  # "按分支统计 / 按客户等级分组"：截到结构词为止，短语内再做维度字段匹配
  pattern: '按(.+?)(?:统计|分组|维度|来看|看)'

# -- TopN（"前 N 名" → 按指标降序 + limit）--------------------------------
topn:
  pattern: '前\s*(\d+)\s*名'

# -- filter：维度值等值（ADR-0014 ①）--------------------------------------
filter_include:
  # 前缀词 + 目标短语，到"的/，/,/句尾"截断（lookahead 防值吞掉后续时间/分组短语）
  pattern: '(?:只看|只统计|仅统计|仅看|仅保留|仅取)\s*(.+?)(?=的|，|,|$)'

# -- filter：维度值排除 ----------------------------------------------------
filter_exclude:
  # "排除/除…外/不含"形态；截断词多一个"外/后"以适配"排除 X 后"语序
  pattern: '(?:排除|不含|除去)\s*(.+?)(?=后|的|外|，|,|$)'

# -- filter：度量阈值（HAVING 语义）----------------------------------------
threshold:
  greater:
    # "超过/大于/高于/不小于/不低于" + 数值 + 可选中文量级；编译为 metric > N
    pattern: '(?:超过|大于|高于|不小于|不低于)\s*([\d.]+)\s*(亿|千万|百万|万)?'
  less:
    # "低于/小于/不足/不超过/不高于" + 数值 + 可选中文量级；编译为 metric < N
    pattern: '(?:低于|小于|不足|不超过|不高于)\s*([\d.]+)\s*(亿|千万|百万|万)?'

# -- 量级与中文编号映射 ----------------------------------------------------
magnitude:
  # 量级词优先匹配长形（千万 → 万）由上面 threshold 正则的交替顺序保证，
  # 本表只做倍率换算，不参与匹配顺序。
  cn_units:
    亿: 100_000_000
    千万: 10_000_000
    百万: 1_000_000
    万: 10_000
  # 季度中文编号 → 阿拉伯数字
  cn_numerals:
    一: 1
    二: 2
    三: 3
    四: 4

# -- 指代追问（ADR-0014 ②，仅全量解析 unmatched 的残句才进入）--------------
followup:
  # 链接词开头或"呢"结尾才算口语残句（否则维持原 unmatched 流程）
  prefixes:
    - 那
    - 那么
    - 换成
    - 改成
    - 改为
    - 按
  # 换维壳：换成/改成/改为/按 引导的短语（可带"那"前缀与"统计/分组/呢"尾缀）；
  # $ 锚防非贪婪截断过早（"按客户等级统计呢"须整体消费到句尾）
  dim_pattern: '(?:那|那么)?(?:换成|改成|改为|按)\s*(.+?)(?:统计|分组)?\s*呢?\s*$'

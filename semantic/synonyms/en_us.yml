# 英文同义词表（locale=en_us）：指标名 / 维度字段名 → 英文措辞列表
#
# owner: agent（解析器形态层；非业务治理资产，故不进 ossie 治理扩展）
# 最后修改: 2026-09-08 从 agent/planner.py 的 _EN_METRIC_SYNONYMS /
#           _EN_DIM_SYNONYMS 外置为数据（ADR-0015）——**纯搬运，逐词等价**，
#           目的是让新场景接入英文措辞时只改配置不改内核（B7 验收前提）。
#
# 为什么不写进 ossie 的 ai_context.synonyms：
#   该列表在解析器里按 locale 分轨使用（zh = 模型注记；en = 模型 ∪ 本表）。
#   模型注记实测全为中文（唯一例外 GMV/AOV 中英通用），zh 轨从不并入英文表；
#   把英文措辞混排进 ai_context.synonyms 会让 locale=zh 的中文问句里出现的
#   英文片段（如分支代码、值词）参与指标匹配 → 破防误命中隔离。
# 为什么不写进治理扩展（custom_extensions）：
#   atlas_governance.schema.json 顶层 additionalProperties: false，只登记 7 个扩展
#   键（governance/lineage/freshness/policy/quality/fibo_alignment/time_dimension），
#   同义词不属治理语义。
#
# 加载入口：agent/compiler.py::load_locale_synonyms("en_us")
#   - 键必须是语义模型（金融 ∪ 零售）中已注册的指标名/维度字段名，
#     由 tests/test_planner.py 的契约测试兜底防漂移（YAML 改名即报红）；
#   - 列表**顺序即语义**：解析器按模型注记 + 本表顺序做最长命中匹配，
#     调整顺序可能改变歧义判定，需连同评测复验；
#   - 值只做小写化比较（解析器 side 处理），本文件按原样书写、不加引号转义技巧。


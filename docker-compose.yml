# Atlas MVP 基础设施 —— Apache 全栈
#
# 技术栈（详见 infra/adr/0004-apache-stack.md）：
#   Apache Iceberg（表格式） + Apache Polaris（REST Catalog + RBAC）
#   + Apache Doris 4.1（OLAP，原生 Iceberg catalog） + MinIO（S3 兼容对象存储）
#   + Milvus（向量检索） + PostgreSQL（Polaris/元数据） + Grafana（可观测）
#
# ⚠️ 个人预算约束下的单机部署。Doris FE+BE 内存压力较大，
#    若单机跑不动，按 ADR-0004 的降级路径：保留 Iceberg+MinIO，Doris 换回 ClickHouse。

services:
  # ============================================================
  # 对象存储：Iceberg 的数据与元数据落盘位置
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: atlas-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "9000:9000"
      - "9002:9001" # 宿主机 9001 被用户 Java 进程占用，console 映射到 9002
    volumes:
      - miniodata:/minio_data
    command: server /minio_data --console-address ":9001"
    healthcheck:
      # 镜像无 curl/wget（UBI 9.4 最小镜像），/bin/sh 是 bash，用 /dev/tcp 做 TCP 探测
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 首次启动创建 Iceberg 使用的 bucket
  minio-init:
    image: minio/mc:latest # RELEASE.2024-05-28T17-19-04Z tag 在加速器不存在（实测）
    container_name: atlas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # 注意：compose 会把 command 字符串按 shell 词法拆分成数组再拼接，&& 易丢失；
    # 完整命令放 entrypoint 数组可原样传给 docker（手动实测 mc alias set 成功）
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-password} && mc mb --ignore-existing local/atlas-warehouse && mc anonymous set none local/atlas-warehouse"]
    restart: "no"

  # ============================================================
  # PostgreSQL：Polaris 元数据 + Atlas 元数据/策略
  # ============================================================
  postgres:
    image: postgres:16
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_meta}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
    ports:
      - "5433:5432" # 宿主机 5432 被用户 assetallocation-postgres 占用，映射到 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Apache Polaris（Incubating）：Iceberg REST Catalog
  # 对象模型 CATALOG / NAMESPACE / TABLE / PRINCIPAL / ROLE / GRANT
  # 每次 loadTable 签发短期存储凭证，引擎永不见根凭证
  #
  # 注意：孵化器项目，若部署复杂度过高，
  #       按 ADR-0004 降级为 Iceberg hadoop catalog（文件系统）
  # ============================================================
  polaris:
    image: apache/polaris:latest
    container_name: atlas-polaris
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: "${POLARIS_CLIENT_ID:-root},${POLARIS_REALM:-POLARIS},${POLARIS_CLIENT_SECRET:-secret}"
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-atlas_meta}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: create
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      QUARKUS_MANAGEMENT_PORT: "8182"
      # MinIO 静态凭证：Polaris 服务端在“表元数据刷新”等场景需直接读 S3
      # （实测：引擎 loadTable 发现新 metadata 版本时触发，无凭证则 500）
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      AWS_REGION: us-east-1
    ports:
      - "8181:8181" # Iceberg REST Catalog API
      - "8182:8182" # management
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ============================================================
  # Apache Doris 4.1：OLAP 引擎
  # 原生 Iceberg catalog（基于 Iceberg Java library，走同一套 catalog API）
  # 读 V1-V3；默认写 V2；V3 写需 format-version 4.1+
  # 4.1 新增 per-user identity mode：真实用户身份透传给 Polaris，
  #   而非所有查询共用一个服务账号 —— 直接服务于 Atlas 的行级权限下推
  #
  # ⚠️ 资源警告：FE + BE 双进程，个人单机内存压力大
  # ============================================================
  doris-fe:
    image: apache/doris:fe-4.1.3
    container_name: atlas-doris-fe
    environment:
      FE_SERVERS: fe1:172.20.80.10:9010
      FE_ID: 1
    ports:
      - "8030:8030" # http
      - "9030:9030" # mysql protocol
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
      # 挂载自定义 fe.conf：官方默认 JVM 堆 8G，在个人机 Docker VM（内存 <8G）
      # 上会吃满宿主机内存导致 BE 查询 MEM_LIMIT_EXCEEDED（实测 2026-09-02）；
      # 调低为 Xmx2g/Xms1g 后可支持全表聚合类验证查询（infra/docker/doris/fe.conf）
      - ./infra/docker/doris/fe.conf:/opt/apache-doris/fe/conf/fe.conf
    networks:
      doris_net:
        ipv4_address: 172.20.80.10
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8030/api/bootstrap || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  doris-be:
    image: apache/doris:be-4.1.3
    container_name: atlas-doris-be
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      FE_SERVERS: fe1:172.20.80.10:9010
      BE_ADDR: 172.20.80.11:9050
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      doris_net:
        ipv4_address: 172.20.80.11
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8040/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  # ============================================================
  # Milvus：向量检索（语义召回的候选通道）
  # 注：Doris 4.1 也有原生向量检索（IVF/IVF_ON_DISK，900 QPS @ 97% recall），
  #     但 MVP 不引入，避免技术栈过度分散（ADR-0004）
  # ============================================================
  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: atlas-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "19530:19530"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: atlas-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcdata:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  # ============================================================
  # Atlas HTTP API（ADR-0012，serving/api.py）
  # 服务面：/health 公开；/plan /compile /ask 需 Bearer JWT（make token 签发）
  # - 容器网络内直连 Doris 9030（execute_sql 只读封装 + Guard 预算不变；
  #   写面 loader/dwd 不入本容器）
  # - 构建参数 GIT_SHA = 快照身份：镜像无 .git，由 ARG 注入 ATLAS_GIT_SHA
  #   （eval/runner.git_short_sha 的 env 覆盖面）。默认最新 29 表全量数据
  #   版本 b933e20（data/snapshots/ 最新锁定 meta）；数据重装后改宿主 .env 的
  #   GIT_SHA 或显式 build args
  # - ATLAS_JWT_SECRET 不落盘默认值（N9）：compose 从宿主 .env 注入运行时；
  #   未设置则服务能起但签发/校验拒绝（serving/auth.py 报错提示）
  # - 会话进程内内存态：重启即失；uvicorn 单进程（workers=1，会话不分裂）
  # 部署与 curl 示例见 README「对外 HTTP API」小节
  # ============================================================
  atlas-api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-7d48dcb}
    container_name: atlas-api
    depends_on:
      doris-fe:
        condition: service_healthy
      polaris:
        condition: service_healthy
    environment:
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-}
      DORIS_HOST: atlas-doris-fe
      DORIS_PORT: "9030"
      DORIS_USER: ${DORIS_USER:-root}
      DORIS_PASSWORD: ${DORIS_PASSWORD:-}
    ports:
      - "8001:8000" # 宿主机 8000 被用户资产配置服务占用，映射到 8001
    # doris-fe 只在 doris_net（compose：指定 networks 即只入该网），
    # atlas-api 必须同网才能解析 atlas-doris-fe:9030
    networks:
      - doris_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # 可观测
  # ============================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: atlas-grafana
    ports:
      - "3001:3000" # 宿主机 3000 被用户 node 服务占用，映射到 3001
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      # Day 51：provisioning（数据源 / 面板 provider / 告警规则）——
      # 面板 JSON 只有被 provisioning 扫描才会加载进 Grafana
      - ./observability/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/provisioning/alerting:/etc/grafana/provisioning/alerting:ro

  # ============================================================
  # 可观测数据链路（可选 profile：起 Collector + Prometheus 才把面板数据源点亮；
  # 不起则 Grafana 面板与告警保持配置态——不对任何数字作伪，见 observability/README.md）
  #   docker compose --profile obs up -d otel-collector prometheus
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector:0.109.0
    container_name: atlas-otel-collector
    profiles: ["obs"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4318:4318" # OTLP HTTP（Atlas SDK 导出端）
      - "8889:8889" # Prometheus exporter（metrics）
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: atlas-prometheus
    profiles: ["obs"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  miniodata:
  pgdata:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:
  milvusdata:
  etcdata:
  grafanadata:

networks:
  doris_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.80.0/24

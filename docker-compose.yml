# Atlas MVP 基础设施 —— Apache 全栈
#
# 技术栈（详见 infra/adr/0004-apache-stack.md）：
#   Apache Iceberg（表格式） + Apache Polaris（REST Catalog + RBAC）
#   + Apache Doris 4.1（OLAP，原生 Iceberg catalog） + MinIO（S3 兼容对象存储）
#   + Milvus（向量检索） + PostgreSQL（Polaris/元数据） + Grafana（可观测）
#
# ⚠️ 个人预算约束下的单机部署。Doris FE+BE 内存压力较大，
#    若单机跑不动，按 ADR-0004 的降级路径：保留 Iceberg+MinIO，Doris 换回 ClickHouse。

services:
  # ============================================================
  # 对象存储：Iceberg 的数据与元数据落盘位置
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: atlas-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/minio_data
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 首次启动创建 Iceberg 使用的 bucket
  minio-init:
    image: minio/mc:RELEASE.2024-05-28T17-19-04Z
    container_name: atlas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-password}
      mc mb --ignore-existing local/atlas-warehouse
      mc anonymous set none local/atlas-warehouse
    restart: "no"

  # ============================================================
  # PostgreSQL：Polaris 元数据 + Atlas 元数据/策略
  # ============================================================
  postgres:
    image: postgres:16
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_meta}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Apache Polaris（Incubating）：Iceberg REST Catalog
  # 对象模型 CATALOG / NAMESPACE / TABLE / PRINCIPAL / ROLE / GRANT
  # 每次 loadTable 签发短期存储凭证，引擎永不见根凭证
  #
  # 注意：孵化器项目，若部署复杂度过高，
  #       按 ADR-0004 降级为 Iceberg hadoop catalog（文件系统）
  # ============================================================
  polaris:
    image: apache/polaris:latest
    container_name: atlas-polaris
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: "${POLARIS_CLIENT_ID:-root},${POLARIS_REALM:-POLARIS},${POLARIS_CLIENT_SECRET:-secret}"
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-atlas_meta}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: create
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      QUARKUS_MANAGEMENT_PORT: "8182"
    ports:
      - "8181:8181" # Iceberg REST Catalog API
      - "8182:8182" # management
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ============================================================
  # Apache Doris 4.1：OLAP 引擎
  # 原生 Iceberg catalog（基于 Iceberg Java library，走同一套 catalog API）
  # 读 V1-V3；默认写 V2；V3 写需 format-version 4.1+
  # 4.1 新增 per-user identity mode：真实用户身份透传给 Polaris，
  #   而非所有查询共用一个服务账号 —— 直接服务于 Atlas 的行级权限下推
  #
  # ⚠️ 资源警告：FE + BE 双进程，个人单机内存压力大
  # ============================================================
  doris-fe:
    image: apache/doris:4.1-fe-ubuntu
    container_name: atlas-doris-fe
    environment:
      FE_SERVERS: fe1:172.20.80.10:9010
      FE_ID: 1
    ports:
      - "8030:8030" # http
      - "9030:9030" # mysql protocol
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    networks:
      doris_net:
        ipv4_address: 172.20.80.10
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8030/api/bootstrap || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  doris-be:
    image: apache/doris:4.1-be-ubuntu
    container_name: atlas-doris-be
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      FE_SERVERS: fe1:172.20.80.10:9010
      BE_ADDR: 172.20.80.11:9050
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      doris_net:
        ipv4_address: 172.20.80.11
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8040/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  # ============================================================
  # Milvus：向量检索（保留，已有工程经验，是简历资产）
  # 注：Doris 4.1 也有原生向量检索（IVF/IVF_ON_DISK，900 QPS @ 97% recall），
  #     但 MVP 不引入，避免技术栈过度分散（ADR-0004）
  # ============================================================
  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: atlas-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: atlas-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcdata:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  # ============================================================
  # 可观测
  # ============================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: atlas-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  miniodata:
  pgdata:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:
  milvusdata:
  etcdata:
  grafanadata:

networks:
  doris_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.80.0/24

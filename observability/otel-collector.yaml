# OpenTelemetry Collector 配置（Atlas 可观测链路，Day 51）
# 角色：接收 Atlas SDK 的 OTLP HTTP（4318）→ metrics 转 Prometheus 抓取（8889）
# 启用：docker compose --profile obs up -d prometheus otel-collector（见 docker-compose.yml）
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [prometheus, debug]
